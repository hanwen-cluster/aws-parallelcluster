Image:
  Os: {{ os }}
  CustomAmi: {{ custom_ami }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: queue1
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: compute-resource1
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 2
SharedStorage:
  # TLS + IAM: exercises efs-proxy, the watchdog and the poll interval set in efs-utils.conf.
  - MountDir: {{ tls_mount_dir }}
    Name: efs-tls-iam
    StorageType: Efs
    EfsSettings:
      EncryptionInTransit: true
      IamAuthorization: true
  # Plain NFS mount through the efs mount helper.
  # Existing file system: ParallelCluster 3.14 supports only one new (managed) EFS.
  - MountDir: {{ plain_mount_dir }}
    Name: efs-plain
    StorageType: Efs
    EfsSettings:
      FileSystemId: {{ existing_efs_id }}
