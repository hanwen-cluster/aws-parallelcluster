Image:
    RootVolume:
        Size: 200
        Encrypted: True

Build:
    InstanceType: {{ instance }}
    ParentImage: {{ parent_image }}
    SecurityGroupIds:
        - {{ default_vpc_security_group_id }}
    SubnetId: {{ public_subnet_id }}
    UpdateOsPackages:
        # Same as the customer configuration (P558591845): update OS packages before installing ParallelCluster.
        Enabled: true
    Installation:
        LustreClient:
            Enabled: {{ enable_lustre_client }}
        NvidiaSoftware:
            Enabled: {{ enable_nvidia }}

DevSettings:
    TerminateInstanceOnFailure: True
{% if extra_chef_attributes %}
    Cookbook:
        ExtraChefAttributes: |
            {{ extra_chef_attributes }}
{% endif %}
