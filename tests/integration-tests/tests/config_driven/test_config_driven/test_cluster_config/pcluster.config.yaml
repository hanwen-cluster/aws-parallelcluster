Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ head_node_instance_type | default("c5.xlarge") }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: compute
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: default
          InstanceType: {{ instance }}
          MaxCount: 2
          MinCount: 1
SharedStorage:
  - MountDir: /shared
    Name: shared-ebs
    StorageType: Ebs
