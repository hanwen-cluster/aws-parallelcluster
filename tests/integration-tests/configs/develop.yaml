{%- import 'common.jinja2' as common with context -%}
{{- common.OSS_COMMERCIAL_X86.append("rocky8") or "" -}}
{{- common.OSS_COMMERCIAL_X86.append("rocky9") or "" -}}
---
test-suites:
  storage:
    test_shared_home.py::test_shared_home:
      dimensions:
        - regions: [ "us-west-1" ]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: ["ubuntu2204"]
          schedulers: [ "slurm" ]
  pcluster_api:
    test_api_infrastructure.py::test_api_infrastructure_with_default_parameters:
      dimensions:
        - regions: ["ap-south-1", "cn-north-1", "us-gov-west-1"]
    test_api_infrastructure.py::test_api_infrastructure_with_full_parameters:
      dimensions:
        - regions: [ "eu-west-1" ]
    test_api.py::test_cluster_slurm:
      dimensions:
        - regions: ["sa-east-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_2 }}]
          schedulers: ["slurm"]
    test_api.py::test_custom_image:
      dimensions:
        - regions: ["sa-east-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_4 }}]
    test_api.py::test_login_nodes:
      dimensions:
        - regions: ["sa-east-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_6 }}]
          schedulers: ["slurm"]
  resource_bucket:
    test_resource_bucket.py::test_resource_bucket:
      dimensions:
        - regions: ["us-west-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_1 }}]
          schedulers: ["slurm"]
  tags:
    test_tag_propagation.py::test_tag_propagation:
      dimensions:
        - regions: ["us-west-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ BATCH_OS_X86_0 }}]
          schedulers: ["slurm", "awsbatch"]
  trainium:
    test_trainium.py::test_trainium:
      dimensions:
        - regions: [{{ trn1_32xlarge_CAPACITY_RESERVATION_2_INSTANCES_2_HOURS_YESPG_UBUNTU2404 }}]
          schedulers: ["slurm"]
          oss: ["ubuntu2404"]
          instances: ["trn1.32xlarge"]
  update:
    test_update.py::test_update_slurm:
      dimensions:
        - regions: ["eu-central-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_3 }}]
    test_update.py::test_update_compute_ami:
      dimensions:
        - regions: ["eu-west-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_5 }}]
    test_update.py::test_update_instance_list:
      dimensions:
        - regions: ["ap-south-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_7 }}]
          schedulers: ["slurm"]
    test_update.py::test_queue_parameters_update:
      dimensions:
        - regions: [ "ap-south-1" ]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_0 }}]
          schedulers: [ "slurm" ]
    test_update.py::test_dynamic_file_systems_update:
      dimensions:
        - regions: ["eu-west-2"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ LUSTRE_OS_X86_2 }}]
          schedulers: ["slurm"]
    test_update.py::test_dynamic_file_systems_update_data_loss:
      dimensions:
        - regions: [ "eu-west-2" ]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ LUSTRE_OS_X86_4 }}]
          schedulers: [ "slurm" ]
    test_update.py::test_dynamic_file_systems_update_rollback:
      dimensions:
        - regions: [{{ OS_X86_6 }}]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ LUSTRE_OS_X86_6 }}]
          schedulers: [ "slurm" ]
    test_update.py::test_multi_az_create_and_update:
      dimensions:
        - regions: ["eu-west-2"]
          schedulers: ["slurm"]
          oss: [{{ OS_X86_1 }}]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
    test_update.py::test_login_nodes_update:
      dimensions:
        - regions: ["us-east-2" ]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_3 }}]
          schedulers: ["slurm"]
    test_update_rollback_failure.py::test_update_rollback_failure:
      dimensions:
        - regions: ["us-east-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_2 }}]
          schedulers: ["slurm"]
  users:
    test_default_user_home.py::test_default_user_local_home:
      dimensions:
        - oss: [{{ OS_X86_5 }}]
          regions: [ "us-west-2" ]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          schedulers: [ "slurm" ]
  proxy:
    test_proxy.py::test_proxy:
      dimensions:
        - regions: ["ap-southeast-5"] # c5 instance type is not available in ap-southeast-5
          instances: ["m6i.xlarge"]
          oss: [{{ OS_X86_7 }}]
          schedulers: ["slurm"]
  pyxis:
    test_pyxis.py::test_pyxis:
      dimensions:
        - regions: ["eu-west-1"]
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: [{{ OS_X86_0 }}]
          schedulers: ["slurm"]
  performance_tests:
    test_osu.py::test_osu:
      dimensions:
        - regions: [ {{ c5n_18xlarge_CAPACITY_RESERVATION_35_INSTANCES_2_HOURS_YESPG_NO_ROCKY_OS_X86_0 }} ]
          instances: [ "c5n.18xlarge" ]
          oss: [{{ NO_ROCKY_OS_X86_0 }}] # ParallelCluster does not release official Rocky images. Skip the test.
          schedulers: [ "slurm" ]
        - regions: [ {{ c5_xlarge_CAPACITY_RESERVATION_510_INSTANCES_2_HOURS_YESPG_NO_ROCKY_OS_X86_1__c5n_18xlarge_CAPACITY_RESERVATION_1_INSTANCES_2_HOURS_NOPG_NO_ROCKY_OS_X86_1 }} ]
          instances: [ "c5.xlarge" ]
          oss: [ {{ NO_ROCKY_OS_X86_1 }} ] # ParallelCluster does not release official Rocky images. Skip the test.
          schedulers: [ "slurm" ]
#    test_starccm.py::test_starccm:
#      dimensions:
#        - regions: [ {{ c5n_18xlarge_CAPACITY_RESERVATION_35_INSTANCES_2_HOURS_YESPG_NO_ROCKY_OS_X86_0 }} ]
#          instances: [ "c5n.18xlarge" ]
#          oss: [{{ NO_ROCKY_OS_X86_0 }}] # ParallelCluster does not release official Rocky images. Skip the test.
#          schedulers: [ "slurm" ]
    test_startup_time.py::test_startup_time:
      dimensions:
        - regions: [ "us-east-1" ]
          oss: [{{ OS_X86_0 }}]
          schedulers: [ "slurm" ]
          instances: [ "t3.micro" ] #This is a placeholder, we do not use this instance in the test
