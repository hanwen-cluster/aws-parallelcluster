name: Cherry-pick to branch

on:
  # Path 1: Label added to an open PR — will cherry-pick when PR is merged
  # Path 2: PR merged while already carrying a cherry-pick:* label — triggers at merge time
  # Path 3: Label added to an already-merged PR (fires as issues event) — triggers immediately
  pull_request:
    types: [labeled, closed]
  issues:
    types: [labeled]

jobs:
  cherry-pick:
    # Run when:
    # 1. A cherry-pick:* label is added to a PR (open or closed via issues event)
    # 2. A PR with cherry-pick:* labels is merged
    if: >
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       startsWith(github.event.label.name, 'cherry-pick:') &&
       github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       contains(toJSON(github.event.pull_request.labels.*.name), 'cherry-pick:')) ||
      (github.event_name == 'issues' &&
       github.event.issue.pull_request &&
       startsWith(github.event.label.name, 'cherry-pick:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get PR details
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Triggered at merge time — extract target(s) from labels
            PR_NUMBER="${{ github.event.pull_request.number }}"
            SOURCE_BRANCH="${{ github.event.pull_request.base.ref }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_AUTHOR="${{ github.event.pull_request.user.login }}"

            # Find all cherry-pick:* labels
            LABELS=$(echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | jq -r '.[] | select(startswith("cherry-pick:"))')
            TARGET_BRANCHES=""
            for LABEL in $LABELS; do
              TARGET="${LABEL#cherry-pick:}"
              TARGET_BRANCHES="${TARGET_BRANCHES}${TARGET} "
            done
          else
            # Triggered by adding a label to a merged PR
            PR_NUMBER="${{ github.event.issue.number }}"
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergeCommit,baseRefName,title,author,state)

            STATE=$(echo "$PR_JSON" | jq -r '.state')
            if [ "$STATE" != "MERGED" ]; then
              echo "::warning::PR #${PR_NUMBER} is not merged yet (state: ${STATE}). Cherry-pick will run automatically when the PR is merged."
              exit 0
            fi

            SOURCE_BRANCH=$(echo "$PR_JSON" | jq -r '.baseRefName')
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
            PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')

            LABEL_NAME="${{ github.event.label.name }}"
            TARGET_BRANCHES="${LABEL_NAME#cherry-pick:}"
          fi

          # Get all commit SHAs from the PR (handles both squash and rebase merge)
          COMMITS=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json commits --jq '.commits[].oid' | tr '\n' ' ')

          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"
          echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_title=${PR_TITLE}" >> "$GITHUB_OUTPUT"
          echo "pr_author=${PR_AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "target_branches=${TARGET_BRANCHES}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pr-info.outputs.commits != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        if: steps.pr-info.outputs.commits != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick and create PR(s)
        if: steps.pr-info.outputs.commits != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITS: ${{ steps.pr-info.outputs.commits }}
          SOURCE_BRANCH: ${{ steps.pr-info.outputs.source_branch }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-info.outputs.pr_title }}
          PR_AUTHOR: ${{ steps.pr-info.outputs.pr_author }}
          TARGET_BRANCHES: ${{ steps.pr-info.outputs.target_branches }}
        run: |
          HAS_FAILURE=false
          for TARGET_BRANCH in ${TARGET_BRANCHES}; do
            CHERRY_PICK_BRANCH="cherry-pick/pr-${PR_NUMBER}-to-${TARGET_BRANCH}"

            echo "Cherry-picking commits from PR #${PR_NUMBER} to ${TARGET_BRANCH}"
            echo "Commits: ${COMMITS}"

            git fetch origin "${TARGET_BRANCH}"
            git checkout -b "${CHERRY_PICK_BRANCH}" "origin/${TARGET_BRANCH}"

            # Cherry-pick all commits in order (works for both squash and rebase)
            CHERRY_PICK_FAILED=false
            for COMMIT in ${COMMITS}; do
              if ! git cherry-pick "${COMMIT}" --no-edit; then
                CHERRY_PICK_FAILED=true
                git cherry-pick --abort
                break
              fi
            done

            if [ "${CHERRY_PICK_FAILED}" = "false" ]; then
              git push origin "${CHERRY_PICK_BRANCH}"
              gh pr create \
                --base "${TARGET_BRANCH}" \
                --head "${CHERRY_PICK_BRANCH}" \
                --title "Cherry-pick #${PR_NUMBER}: ${PR_TITLE}" \
                --body "Automated cherry-pick of #${PR_NUMBER} from \`${SOURCE_BRANCH}\` to \`${TARGET_BRANCH}\`.

          Original PR by @${PR_AUTHOR}." \
                --label "cherry-pick"
              echo "✅ Cherry-pick PR to ${TARGET_BRANCH} created successfully"
            else
              HAS_FAILURE=true
              gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" \
                --body "⚠️ Automated cherry-pick to \`${TARGET_BRANCH}\` failed due to merge conflicts.

          Please cherry-pick manually"
              echo "::error::Cherry-pick to ${TARGET_BRANCH} failed due to conflicts."
            fi

            # Clean up for next iteration
            git checkout --detach 2>/dev/null || true
            git branch -D "${CHERRY_PICK_BRANCH}" 2>/dev/null || true
          done

          if [ "${HAS_FAILURE}" = "true" ]; then
            exit 1
          fi
